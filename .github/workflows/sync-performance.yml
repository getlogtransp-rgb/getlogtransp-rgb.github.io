name: Atualizar performance (Google Drive)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-performance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client google-auth cryptography
      - name: Baixar e trancar os JSON
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GETLOG_MASTER_KEY: ${{ secrets.GETLOG_MASTER_KEY }}
          GDRIVE_FOLDER_ID: 1a3B1YhhhTs_mCIiM6MNgqcnB7JWFDccM
        run: python .github/scripts/sync_drive.py
      - name: Publicar se mudou
        run: |
          git add portal/dados
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git -c user.name="getlog-bot" -c user.email="getlog-bot@users.noreply.github.com" commit -m "Atualiza dados de performance"
          git push

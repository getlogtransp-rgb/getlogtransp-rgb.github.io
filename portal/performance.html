<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Performance de coleta · GETLOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002060;--navy-2:#0B3A8F;--navy-d:#001645;--or:#F86800;--or-2:#FF8A2B;--or-s:#FFF0E5;
  --bg:#EDF0F5;--card:#FFFFFF;--ink:#101A33;--ink-2:#46526E;--ink-3:#8590A8;--line:#DFE4EE;--line-2:#EEF1F6;
  --ok:#0F8F78;--ok-b:#20C7A7;--ok-s:#DDF8F1;--aqua:#20C7A7;--aqua-s:#DDF8F1;--warn:#A16207;--warn-b:#EAB308;--warn-s:#FDF5D8;--bad:#B91C1C;--bad-b:#EF4444;--bad-s:#FDE8E8;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fc:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1222;--card:#121B30;--ink:#E7ECF6;--ink-2:#AEB8CE;--ink-3:#7783A0;--line:#24304B;--line-2:#1A2440;--or-s:#3A2414;--ok-s:#0F2E1C;--warn-s:#3A2F0B;--bad-s:#3B1515;--ok:#45E0C0;--aqua:#45E0C0;--aqua-s:#103A34;--warn:#FACC15;--bad:#F87171}}
:root[data-theme="dark"]{--bg:#0B1222;--card:#121B30;--ink:#E7ECF6;--ink-2:#AEB8CE;--ink-3:#7783A0;--line:#24304B;--line-2:#1A2440;--or-s:#3A2414;--ok-s:#0F2E1C;--warn-s:#3A2F0B;--bad-s:#3B1515;--ok:#45E0C0;--aqua:#45E0C0;--aqua-s:#103A34;--warn:#FACC15;--bad:#F87171}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.n{font-family:var(--fc);font-variant-numeric:tabular-nums}
svg{flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:#fff;border-bottom:3px solid var(--or)}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:5px clamp(10px,2.2vw,24px)}
.logo{background:#fff;border-radius:7px;padding:3px 7px;height:34px;display:flex;align-items:center}
.logo img{height:27px;width:auto;display:block}
.ttl{font-weight:700;font-size:15px;line-height:1.1}
.ttl small{display:block;font-weight:400;font-size:11px;color:#B6C2E4}
.sp{flex:1}
.upd{display:flex;gap:0;border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.upd div{padding:4px 9px;line-height:1.15}
.upd div+div{border-left:1px solid rgba(255,255,255,.18)}
.upd small{display:block;font-size:11px;color:#B6C2E4}
.upd b{font-family:var(--fc);font-size:13px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B6C2E4}
.dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
.dot.off{background:var(--warn-b);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--or);color:#fff;border-radius:7px;padding:6px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.tbtn:hover{background:var(--or-2)}
.tbtn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
.tbtn .bd{background:#fff;color:var(--or);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}
.tbtn svg{width:15px;height:15px}

.wrap{max-width:1480px;margin:0 auto;padding:9px clamp(9px,2.2vw,24px) 20px}

.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.dd{position:relative}
.ddb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap;max-width:220px}
.ddb:hover{border-color:var(--ink-3)}
.ddb span{overflow:hidden;text-overflow:ellipsis}
.ddb.on{border-color:var(--navy);background:#E8EDF9;color:var(--navy);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ddb.on{background:#1B2A55;color:#C9D5FF;border-color:#3B5BB8}}
:root[data-theme="dark"] .ddb.on{background:#1B2A55;color:#C9D5FF;border-color:#3B5BB8}
.ddb .c{background:var(--navy);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}
.ddb svg{width:14px;height:14px;opacity:.7}.ddb .chev-down{width:13px;height:13px;margin-left:1px;opacity:.55;transition:transform .18s ease,opacity .18s ease}.ddb:hover .chev-down{opacity:.9}.ddb[aria-expanded="true"] .chev-down{transform:rotate(180deg);opacity:.9}
.ddb.date{border-color:var(--navy);color:var(--navy);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ddb.date{color:#C9D5FF;border-color:#3B5BB8}}
:root[data-theme="dark"] .ddb.date{color:#C9D5FF;border-color:#3B5BB8}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(6,22,66,.18);min-width:270px}
.pop.r{left:auto;right:0}
.ms-s{padding:8px;border-bottom:1px solid var(--line-2)}
.ms-s input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);font-size:13px}
.ms-a{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line-2)}
.lnk{border:0;background:none;color:var(--navy-2);font-size:12.5px;font-weight:600;padding:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lnk{color:#9DB4FF}}
:root[data-theme="dark"] .lnk{color:#9DB4FF}
.ms-l{max-height:270px;overflow:auto;padding:4px}
.ms-l label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.ms-l label:hover{background:var(--bg)}
.ms-l input{accent-color:var(--navy);width:15px;height:15px;flex:none}
.ms-l label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-l label em{font-style:normal;color:var(--ink-3);font-size:12px;font-family:var(--fc)}
.ms-e{padding:14px;color:var(--ink-3);text-align:center;font-size:13px}
.clr{margin-left:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.clr:hover{border-color:var(--bad-b);color:var(--bad)}
.fdiv{width:1px;align-self:stretch;background:var(--line);margin:0 2px}

.cal{display:flex;min-width:0}
.cal-p{display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--bg);border-right:1px solid var(--line);border-radius:10px 0 0 10px;min-width:150px}
.cal-p button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;font-weight:600;font-size:13px}
.cal-p button:hover,.cal-p button[aria-pressed="true"]{background:var(--card);color:var(--navy)}
.cal-m{padding:12px 14px 10px;width:300px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:14.5px}
.cal-h button{border:0;background:var(--bg);border-radius:7px;width:30px;height:30px;font-size:16px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 0}
.cal-g button{border:0;background:transparent;height:34px;border-radius:7px;font-weight:600;font-size:13px;font-family:var(--fc)}
.cal-g button:not(:disabled):hover{background:var(--bg)}
.cal-g button:disabled{color:var(--ink-3);opacity:.35}
.cal-g button.in{background:#E1E8F8;border-radius:0}
.cal-g button.s,.cal-g button.e{background:var(--navy);color:#fff;border-radius:7px}
.cal-g button.hd{position:relative}
.cal-g button.hd::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--or)}
.cal-g button.s::after,.cal-g button.e::after{background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal-g button.in{background:#1B2A55}}
:root[data-theme="dark"] .cal-g button.in{background:#1B2A55}
.cal-f{font-size:12px;color:var(--ink-3);text-align:center;margin-top:8px}

.hero{display:grid;grid-template-columns:285px minmax(0,1fr);gap:10px;margin-bottom:10px}
.pcard{background:var(--navy);background:linear-gradient(155deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:118px 1fr;gap:4px 10px;align-items:center}
.pcard h2{grid-column:1/-1;margin:0;font-size:14px;font-weight:600;color:#C9D3F0;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.tag.ok{background:var(--ok-b);color:#04220F}.tag.warn{background:var(--warn-b);color:#2A1E00}.tag.bad{background:var(--bad-b);color:#fff}
.gauge{position:relative}
.gauge svg{width:100%;height:auto;display:block}
.pv{line-height:1}
.pv b{display:block;font-family:var(--fc);font-weight:700;font-size:34px;letter-spacing:-.4px}
.pv span{font-size:12px;color:#B6C2E4;display:block;margin-top:4px}
.pmeta{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pmeta div{background:rgba(255,255,255,.07);border-radius:7px;padding:5px 8px}
.pmeta small{display:block;font-size:11.5px;color:#B6C2E4}
.pmeta b{font-family:var(--fc);font-size:17px;font-weight:600}.pmeta.top-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.pmeta.top-metrics div{min-width:0;padding:5px 8px}.pmeta.top-metrics small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta.top-metrics b{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.pmeta.top-metrics b em{font-family:var(--f);font-size:10.5px;font-style:normal;font-weight:500;color:#B6C2E4}.pmeta.top-metrics .unload-metric{cursor:pointer;position:relative;transition:background .15s ease}.pmeta.top-metrics .unload-metric:hover,.pmeta.top-metrics .unload-metric.on{background:rgba(255,255,255,.13)}.pmeta.top-metrics .unload-metric .sub{display:block;margin-top:2px;font-size:10.5px;color:#B6C2E4;white-space:normal}.unload-list{grid-column:1/-1;background:rgba(255,255,255,.07);border-radius:8px;padding:5px 7px;max-height:170px;overflow:auto}.unload-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.unload-row:last-child{border-bottom:0}.unload-row span{font-size:11px;color:#D7DFF4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unload-row b{font-size:13px!important;color:#fff}.unload-empty{font-size:11px;color:#B6C2E4;padding:6px 4px}
.pbar{grid-column:1/-1;position:relative;height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:4px}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;text-decoration:none}
.pbar em{position:absolute;top:9px;font-size:10.5px;font-style:normal;color:#B6C2E4;transform:translateX(-50%)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{padding:11px 14px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0;position:relative}
.kpi:nth-child(5n){border-right:0}
.kpi:nth-last-child(-n+5){border-bottom:0}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-family:var(--fc);font-weight:700;font-size:26px;line-height:1.1;margin-top:2px}
.kpi .h{font-size:12px;color:var(--ink-3)}
.kpi.hot{background:var(--or-s)}
.kpi.hot .v{color:var(--or)}
.kpi.hot button{position:absolute;right:10px;top:10px;border:0;background:var(--or);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600}
.kpi[data-metric]{cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.kpi[data-metric]:hover{box-shadow:inset 0 0 0 1px var(--navy-2);z-index:1}
.kpi[data-metric].metric-on{box-shadow:inset 0 0 0 2px var(--or);background:var(--or-s)}

.alerts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.al{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--or);border-radius:10px;padding:9px 12px;text-align:left;width:100%;min-width:0}
.al.b{border-left-color:var(--bad-b)}.al.n{border-left-color:var(--navy)}
.al .ic{width:30px;height:30px;border-radius:8px;background:var(--or-s);display:grid;place-items:center;color:var(--or);flex:none}
.al.b .ic{background:var(--bad-s);color:var(--bad)}.al.n .ic{background:var(--line-2);color:var(--navy)}
.al .ic svg{width:16px;height:16px}
.al div{min-width:0}
.al small{color:var(--ink-3);font-size:11.5px}
.al strong{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al span{font-size:12px;color:var(--ink-2)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ch h3{margin:0;font-size:15px;font-weight:700}
.ch p{margin:1px 0 0;color:var(--ink-3);font-size:12.5px}
.seg{display:inline-flex;background:var(--bg);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(10,36,99,.15)}

.stack{display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--bg)}
.stack div{height:100%}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.leg div{border-left:3px solid;padding:2px 0 2px 9px}
.leg small{display:block;font-size:12px;color:var(--ink-2)}
.leg b{font-family:var(--fc);font-size:20px;font-weight:700}
.leg em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:6px}
.note{margin-top:10px;font-size:12.5px;color:var(--ink-2);background:var(--bg);border-radius:7px;padding:7px 10px}

.hb{display:flex;flex-direction:column;gap:2px}
.hr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;border:0;background:transparent;padding:5px 6px;margin:0 -6px;border-radius:7px;text-align:left;width:calc(100% + 12px)}
button.hr:hover{background:var(--bg)}
.hr .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .nm em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.hr .q{font-family:var(--fc);font-weight:700;font-size:14px;text-align:right}
.hr .q small{font-family:var(--f);font-weight:400;color:var(--ink-3);font-size:11.5px;margin-left:4px}
.hr .t{grid-column:1/-1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative}
.hr .t i{display:block;height:100%;border-radius:3px;background:var(--navy)}
.hr .t i.o{background:var(--or)}
.hr .t u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.rk{display:inline-block;width:20px;color:var(--ink-3);font-family:var(--fc)}

.dn{display:flex;gap:16px;align-items:center}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-family:var(--fc);font-weight:700;font-size:24px;color:var(--navy);line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .donut .c b{color:#C9D5FF}}
:root[data-theme="dark"] .donut .c b{color:#C9D5FF}
.donut .c small{display:block;font-size:11px;color:var(--ink-3)}
.dl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dl div{display:flex;align-items:center;gap:8px;font-size:13px}
.dl i{width:10px;height:10px;border-radius:2px;flex:none}
.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{font-family:var(--fc)}
.dl em{font-style:normal;color:var(--ink-3);font-size:12px;width:44px;text-align:right}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer;user-select:none}
th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
td{padding:6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--fc);font-variant-numeric:tabular-nums}
th.r{font-family:var(--f)}
tbody tr:hover{background:var(--bg)}
tr[data-setf]{cursor:pointer}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok-s);color:var(--ok)}.p-warn{background:var(--warn-s);color:var(--warn)}.p-bad{background:var(--bad-s);color:var(--bad)}.p-n{background:var(--line-2);color:var(--ink-2)}
.pc{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.pc .m{width:46px;height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.pc .m i{display:block;height:100%}
.pc b{font-family:var(--fc);min-width:50px;text-align:right}
.pc b.ok{color:var(--ok)}.pc b.warn{color:var(--warn)}.pc b.bad{color:var(--bad)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.search{flex:1;min-width:200px;position:relative}

<body>
<header class="top"><div class="top-in">
  <div class="logo"><img alt="GETLOG Transportes" src="/assets/logo-getlog.webp"></div>
  <div class="ttl">Performance de coleta<small id="hdrSub">Carregando dados</small></div>
  <div class="sp"></div>
  <div class="upd"><div><small>Última atualização</small><b id="hLast">—</b></div><div><small>Próxima atualização</small><b id="hNext">—</b></div></div>
  <span class="live" id="hLive"><span class="dot"></span>Ao vivo</span>   <script>document.write(GL_TEMA.btn("tbtn ghost"))</script>
  <button class="tbtn ghost" id="btnRef" type="button" title="Atualizar agora" onclick="this.disabled=true;Promise.resolve(checkUpdates(true)).finally(()=>this.disabled=false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span class="lb">Atualizar</span></button>
  <button class="tbtn ghost" id="btnHome" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span class="lb">Painel</span></button>
  <button class="tbtn" id="btnPend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><span class="lb">Ver pendentes</span><span class="bd" id="pendBadge">0</span></button>
</div></header>

<main class="wrap">
  <div class="fbar" id="fbar" hidden></div>
  <div id="app"><div class="state"><h2>Carregando a operação</h2><div class="skel"></div><div class="skel" style="max-width:200px"></div></div></div>
</main>
<div class="toast" id="toast"></div>

<script src="/portal/perf-guard.js?v=7"></script>
<script src="/portal/core.js?v=4"></script>
<script src="/portal/drive-api.js?v=9"></script>
<script>
const CONFIG={PASTA:"/portal/dados/",PREFIXO:"",DIAS_HISTORICO:62,INCLUIR_SABADO:true,INTERVALO_ATUALIZACAO_MIN:15,CHECAR_A_CADA_SEG:900,META:98,ALERTA:80,EMPRESA_PROPRIA:"GET"};
const {COLS,NAO_ATRIB,num,str,empOf,nameOf,toRecords,parseDT,metaUpdate,normRows}=window.GL_CORE;
const FILTROS=[["sel","Seller","seller"],["cli","Cliente","cli"],["reg","Região","reg"],["end","Endereço","end"],["bai","Bairro","bai"],["cid","Cidade","cid"],["ma","Motorista","ma"],["emp","Quem coletou","emp"],["des","Descarregado","des"],["sit","Situação","sit"],["pri","Prioridade","pri"]];
const EXTRA_FILTROS=[["st","Status","st"]];
const TODOS_FILTROS=[...FILTROS,...EXTRA_FILTROS];

const S={byDate:new Map(),meta:new Map(),dates:[],from:null,to:null,f:Object.fromEntries(TODOS_FILTROS.map(x=>[x[0],new Set()])),metric:null,rankMode:"pen",tSort:{k:"pen",d:-1},tPage:0,tQ:"",pQ:"",pOpen:new Set(),gapOpen:new Set(),unloadOpen:false,view:"home",lastCheck:null,src:"http",pop:null,popQ:"",cal:null,calPick:null,msStart:0,grp:{sit:new Set(),pri:new Set()}};

const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat("pt-BR");
const N=v=>nf.format(Math.round(v||0));
const P=v=>isFinite(v)?(v*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%":"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmtD=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const keyD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const k2d=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
const lblD=k=>{const [y,m,d]=k.split("-");return `${d}/${m}`};
const lblF=k=>{const [y,m,d]=k.split("-");return `${d}/${m}/${y}`};
const wk=["dom","seg","ter","qua","qui","sex","sáb"];
const lblDW=k=>`${wk[k2d(k).getDay()]} ${lblD(k)}`;
const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const empLbl=e=>e===CONFIG.EMPRESA_PROPRIA?"GETLOG":e;
const SIDS=new Map();const sellerLbl=v=>{const ids=SIDS.get(v);return ids&&ids.size?v+" | "+[...ids].join(", "):v};
const optLbl=(k,v)=>k==="sel"?sellerLbl(v):k==="ma"?(v===NAO_ATRIB?"Sem motorista atribuído":nameOf(v)):k==="emp"?empLbl(v):k==="sit"&&String(v).includes("::")?String(v).split("::")[1]:v;
const priorGroup=v=>["NORMAL","FORA DO PREVISTO"].includes(str(v).toUpperCase())?"Normal":"Prioridades";
const perfCls=v=>v*100>=CONFIG.META?"ok":v*100>=CONFIG.ALERTA?"warn":"bad";
const perfColor=v=>({ok:"var(--ok-b)",warn:"var(--warn-b)",bad:"var(--bad-b)"})[perfCls(v)];
const perfTxt=v=>({ok:"Na meta",warn:"Atenção",bad:"Crítico"})[perfCls(v)];
const initials=n=>{const p=nameOf(n).split(/\s+/).filter(Boolean);return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase()};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2400)}

function ingest(dk,json,lastMod){
  const rows=normRows(toRecords(json),dk);for(const r of rows)if(r.sid){let x=SIDS.get(r.seller);if(!x)SIDS.set(r.seller,x=new Set());x.add(r.sid)}const g=new Map();for(const r of rows){if(!g.has(r.dk))g.set(r.dk,[]);g.get(r.dk).push(r)}
  if(!g.size&&dk)g.set(dk,[]);
  for(const [k,v] of g){
    S.byDate.set(k,v);let upd=metaUpdate(json)||lastMod||null;
    if(!upd){let mx=null;for(const r of v)if(/^\d{2}:\d{2}/.test(r.hora)&&(!mx||r.hora>mx))mx=r.hora;if(mx){const d=k2d(k);const [h,mi]=mx.split(":").map(Number);d.setHours(h,mi,0,0);upd=d}}
    S.meta.set(k,{upd,sig:null});
  }
  return [...g.keys()];
}
function candidateDates(){const out=[];const d=new Date();d.setHours(12,0,0,0);for(let i=0;i<CONFIG.DIAS_HISTORICO;i++){const w=d.getDay();if(w!==0&&(CONFIG.INCLUIR_SABADO||w!==6))out.push(new Date(d));d.setDate(d.getDate()-1)}return out}
const urlFor=d=>encodeURI(CONFIG.PASTA+CONFIG.PREFIXO+fmtD(d)+".json");
async function fetchDay(d){const x=await window.GL_API.dia(fmtD(d));if(!x)return {miss:true};return {json:x.json,lm:x.lm?new Date(x.lm.getTime()):null,sig:x.sig}}
async function embeddedPreview(){return window.GL_FINAL?window.GL_FINAL():null}
async function useEmbeddedPreview(){
  try{const p=await embeddedPreview();if(!p)return false;S.src="previa";for(const [k,v] of Object.entries(p))ingest(k,v,null);afterLoad();return true}catch(e){console.warn("Falha ao carregar prévia embutida",e);return false}
}
const dDia=s=>{const [d,m,y]=s.split(".");return new Date(+y,m-1,+d,12)};
// Abre primeiro os dias mais recentes (e o período do link), mostra a tela e completa o histórico em segundo plano.
async function loadAll(){
  let L=window.GL_API.ordem(await window.GL_API.lista());
  if(!L.length&&location.protocol!=="file:"){await new Promise(r=>setTimeout(r,2500));L=window.GL_API.ordem(await window.GL_API.lista(true))}
  if(!L.length){if(location.protocol==="file:"){S.src="local";return showPicker()}return showEmpty()}
  const lim=keyD(new Date(Date.now()-CONFIG.DIAS_HISTORICO*864e5)),de=new URLSearchParams(location.search).get("de");
  const ds=L.map(x=>dDia(x.dia)).filter(d=>keyD(d)>=lim);
  const first=ds.filter((d,i)=>i<2||(de&&keyD(d)>=de)),rest=ds.filter(d=>!first.includes(d));
  const take=async list=>{let n=0;await window.GL_API.pool(list,6,async d=>{const x=await fetchDay(d);if(x.miss)return;try{ingest(keyD(d),x.json,x.lm).forEach(k=>S.meta.get(k).sig=x.sig);n++}catch(e){console.warn("Dia ilegível",fmtD(d),e)}});return n};
  const found=await take(first);
  if(found)afterLoad();
  sub();
  if(rest.length&&await take(rest))afterLoad(!!found);
  if(!S.dates.length)showEmpty();
}
// Chamado pela camada de dados quando a lista do Drive é conferida (no horário previsto ou pelo botão Atualizar).
let FORCED=false,UNSUB=null,RELOAD=false;
const sub=()=>{if(!UNSUB){UNSUB=window.GL_API.assinar(onUpdate);addEventListener("pagehide",UNSUB)}};
async function onUpdate(est,mud){
  S.agenda=est;S.lastCheck=new Date();if(S.src!=="http")return;
  if(!S.dates.length){if((FORCED||mud.length)&&!RELOAD){RELOAD=true;FORCED=false;try{await loadAll()}finally{RELOAD=false}}return}
  let changed=false;
  for(const s of mud){const d=dDia(s),k=keyD(d);try{const x=await fetchDay(d);if(x.miss||S.meta.get(k)?.sig===x.sig)continue;ingest(k,x.json,x.lm).forEach(kk=>S.meta.get(kk).sig=x.sig);changed=true}catch(e){console.warn("Atualização",s,e)}}
  if(changed){const wasLatest=S.to===S.dates[0];afterLoad(true);if(wasLatest&&S.from===S.to){S.from=S.to=S.dates[0]}else if(wasLatest)S.to=S.dates[0];render();toast("Dados atualizados")}
  else{if(S.dates.length)renderHeader();if(FORCED)toast(est.erro?"Sem conexão com os dados. Tente de novo em instantes.":"Os dados já estão atualizados")}
  FORCED=false;
}
async function checkUpdates(force){if(S.src!=="http")return;FORCED=!!force;await window.GL_API.verificar()}

function kpiDelta(cur,key){if(S.from!==S.to)return "";const d=k2d(S.from);d.setDate(d.getDate()-1);const pk=keyD(d),pr=S.byDate.get(pk);if(!pr)return "";const prf=applyF(pr),prev=sum(prf);let a=cur,b=prev[key];if(key==="pv"){a=visitPct(applyF(baseRows()));b=visitPct(prf)}else if(key==="pc"){a=cur.prev?cur.col/cur.prev:0;b=prev.prev?prev.col/prev.prev:0}const diff=a-b;if(Math.abs(diff)<.00001)return `<span class="delta flat">0</span>`;const up=diff>0;const pct=["pv","pc"].includes(key)?Math.abs(diff*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" p.p.":N(Math.abs(diff));return `<span class="delta ${up?"up":"down"}">${up?"▲":"▼"} ${pct}</span>`}
function genericSort(root=document){root.querySelectorAll("table[data-sortable] th[data-col]").forEach(th=>th.onclick=()=>{const table=th.closest("table"),body=table.tBodies[0],idx=[...th.parentElement.children].indexOf(th),dir=th.dataset.dir==="asc"?"desc":"asc";table.querySelectorAll("th[data-col]").forEach(x=>{x.removeAttribute("aria-sort");delete x.dataset.dir});th.dataset.dir=dir;th.setAttribute("aria-sort",dir==="asc"?"ascending":"descending");const rows=[...body.rows];rows.sort((a,b)=>{const x=a.cells[idx]?.dataset.sort??a.cells[idx]?.textContent??"",y=b.cells[idx]?.dataset.sort??b.cells[idx]?.textContent??"";const nx=Number(String(x).replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",",".")),ny=Number(String(y).replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",","."));const c=isFinite(nx)&&isFinite(ny)&&String(x).match(/\d/)&&String(y).match(/\d/)?nx-ny:String(x).localeCompare(String(y),"pt-BR",{numeric:true});return dir==="asc"?c:-c});rows.forEach(r=>body.appendChild(r))})}

function afterLoad(keep){
  S.dates=[...S.byDate.keys()].filter(k=>S.byDate.get(k).length).sort().reverse();
  if(!S.dates.length)return showEmpty();
  if(!keep||!S.from){if(!keep)loadURLState();if(!S.from||!S.dates.includes(S.from))S.from=S.dates[0];if(!S.to||!S.dates.includes(S.to))S.to=S.from}
  S.view=location.hash==="#pendentes"?"pend":"home";
  render();
}

function metricMatch(r,m){if(m==="prev")return r.prev>0;if(m==="col")return r.col>0;if(m==="jus")return isJustifiedStatus(r.st);if(m==="pen")return r.pen>0;if(m==="adi")return r.adi>0;if(m==="tot")return r.tot>0;if(m==="get")return r.tot>0&&r.emp===CONFIG.EMPRESA_PROPRIA;if(m==="third")return r.tot>0&&r.emp!==CONFIG.EMPRESA_PROPRIA;if(m==="des")return r.tot>0&&r.ndes<=0&&r.emp===CONFIG.EMPRESA_PROPRIA;if(m==="ndes")return r.ndes>0&&r.emp===CONFIG.EMPRESA_PROPRIA;return true}
function applyF(rows,skip){
  const act=TODOS_FILTROS.filter(([k])=>k!==skip&&k!=="sit"&&S.f[k].size);
  let out=act.length?rows.filter(r=>act.every(([k,,fld])=>S.f[k].has(r[fld]))):rows;
  if(S.metric&&skip!=="metric")out=out.filter(r=>metricMatch(r,S.metric));
  if(skip==="sit"||!S.f.sit.size)return out;
  const sm=sellerState(out);
  return out.filter(r=>{const x=sm.get(sKey(r));return x&&[...S.f.sit].some(v=>v===x.sit||v===x.sit+"::"+x.st)});
}
function sum(rows){const a={prev:0,col:0,nc:0,adi:0,tot:0,nor:0,ndes:0,jus:0,pen:0};for(const r of rows)for(const k in a)a[k]+=r[k];return a}
function groupBy(rows,fn){const m=new Map();for(const r of rows){const k=fn(r);let g=m.get(k);if(!g){g={k,rows:[],prev:0,col:0,adi:0,tot:0,jus:0,pen:0};m.set(k,g)}g.rows.push(r);g.prev+=r.prev;g.col+=r.col;g.adi+=r.adi;g.tot+=r.tot;g.jus+=r.jus;g.pen+=r.pen}return [...m.values()]}
// Chave do seller = nome do seller + cliente (regra do dono).
const sKey=r=>normStatus(r.seller)+"|"+r.cli;
// Linha sem nenhum número (previsto, coletado, justificado, em rota) não aparece nas listas.
const temInfo=g=>g.prev>0||g.col>0||g.jus>0||g.pen>0||g.tot>0;
const JUSTIFIED_STATUS=new Set(["LOJA FECHADA","FECHADA","PRODUTO INDISPONIVEL","CODIGO DE COLETA NAO INFORMADO","ENDERECO DIVERGENTE","NAO LOCALIZEI O ENDERECO","ERRO DO SISTEMA","PACOTE CANCELADO","KWAI - ERRO NA OCORRENCIA","DROP RECEBEU","DROP CANCELADO OU FORA DA DS FM NOR","PACOTE CANCELADO OU FORA DA DS FM NOR"]);

const isJustifiedStatus=s=>{const v=normStatus(s);return JUSTIFIED_STATUS.has(v)||v==="MISS SCAN"||v.startsWith("MISS SCAN /")};
function sellerState(rows){
  const m=new Map();
  for(const g of groupBy(rows,sKey)){
    const collected=g.rows.some(r=>r.col>0||r.tot>0);
    const justified=g.rows.some(r=>isJustifiedStatus(r.st)||(r.jus>0&&normStatus(r.st)!=="BAIXA INDEVIDA"));
    const visited=collected||justified;
    // Baixa indevida é pendência não justificada; mas se alguém coletou ou justificou esse seller, ele conta como visitado.
    const bx=g.rows.filter(r=>normStatus(r.st)==="BAIXA INDEVIDA");
    if(bx.length&&!collected&&!g.rows.some(r=>r.jus>0&&normStatus(r.st)!=="BAIXA INDEVIDA")){const pen=bx.reduce((s,r)=>s+Math.max(r.pen,r.prev-r.col,0),0)||Math.max(g.pen,1);m.set(g.k,{sit:"Pendente",st:bx[0].st,pen,visited:false,collected,justified:false,prev:g.prev,col:g.col});continue}
    let st="—";
    // Coletado e entregue no DROP: mostra "DROP Recebeu" em vez de "Coletado" para não esconder esse status.
    if(collected){const d=g.rows.find(r=>normStatus(r.st)==="DROP RECEBEU");st=d?d.st:"Coletado"}
    else if(justified){const x=g.rows.find(r=>isJustifiedStatus(r.st));st=x?.st||"Justificado"}
    else if(g.pen>0){const x=g.rows.filter(r=>r.pen>0).sort((a,b)=>b.pen-a.pen)[0];st=normStatus(x?.st)==="ACEITA"?"Aceita":"Em rota"}
    else{const v=normStatus(g.rows[0]?.st);st=!v||v==="EM ROTA"||v==="ACEITA"||v==="COLETADO"?"Sem pendência":g.rows[0].st}
    m.set(g.k,{sit:visited||g.pen<=0?"Finalizado":"Pendente",st,pen:visited?0:g.pen,visited,collected,justified,prev:g.prev,col:g.col});
  }

}
function visitStats(rows){const groups=groupBy(rows,sKey),sm=sellerState(rows);let prev=0,visitedPrev=0,justifiedPrev=0;for(const g of groups){prev+=g.prev;const st=sm.get(g.k);if(st?.visited)visitedPrev+=g.prev;if(st?.justified)justifiedPrev+=Math.max(0,g.prev-g.col)}return {prev,visitedPrev,justifiedPrev,p:prev?visitedPrev/prev:NaN}}

  return `<svg viewBox="0 0 160 86" aria-hidden="true">

function sellerTable(sellers){
  const q=S.tQ.toLowerCase();let list=sellers.map(s=>({...s,ma:s.maList.join(" "),pv:s.pv}));
  if(q)list=list.filter(s=>(s.seller+" "+s.sid+" "+s.ma+" "+s.mo+" "+s.bai+" "+s.cid+" "+s.cep+" "+s.end+" "+s.cli+" "+s.jtxt).toLowerCase().includes(q));
  const {k,d}=S.tSort;list.sort((a,b)=>{const x=a[k]??"",y=b[k]??"";return (typeof x==="string"?String(x).localeCompare(String(y),"pt-BR",{numeric:true}):(x-y))*d||b.pen-a.pen});
  const per=25,pages=Math.max(1,Math.ceil(list.length/per));S.tPage=Math.min(S.tPage,pages-1);const pg=list.slice(S.tPage*per,S.tPage*per+per);
  const th=(key,l,r)=>`<th class="s ${r?"r":""}" data-sort="${key}" ${S.tSort.k===key?`aria-sort="${S.tSort.d<0?"descending":"ascending"}"`:""}>${l}</th>`;
  const cell=(k,v,l,cls="")=>`<td class="${cls} clickcell" data-l="${l}" data-setf="${k}" data-v="${esc(v)}">${esc(v)||"—"}</td>`;
  return `<div class="tw mc compact-table"><table><thead><tr>${th("seller","Seller")}${th("end","Endereço")}${th("cid","Cidade")}${th("bai","Bairro")}${th("cep","CEP")}${th("cli","Cliente")}${th("ma","Motorista atribuído")}${th("reg","Região")}${th("prev","Previsto",1)}${th("col","Coletado previsto",1)}${th("tot","Coletado total",1)}${th("mo","Coletado por")}${th("adi","Adiantado",1)}${th("jus","Justificado",1)}${th("pen","Em rota",1)}${th("pv","Visita",1)}${th("st","Status")}${th("jtxt","Observação")}</tr></thead><tbody>${pg.map(s=>`<tr data-setf="sel" data-v="${esc(s.seller)}">${cell("sel",s.seller,"Seller","first")}${cell("end",s.end,"Endereço")}${cell("cid",s.cid,"Cidade")}${cell("bai",s.bai,"Bairro")}<td data-l="CEP">${esc(s.cep)||"—"}</td>${cell("cli",s.cli,"Cliente")}<td class="clickcell" data-l="Motorista" data-setf="ma" data-v="${esc(s.maList[0]||NAO_ATRIB)}">${esc(s.maList.map(m=>m===NAO_ATRIB?"Sem motorista":nameOf(m)).join(" / "))}</td>${cell("reg",s.reg,"Região")}<td class="r" data-l="Previsto">${N(s.prev)}</td><td class="r" data-l="Coletado previsto">${N(s.col)}</td><td class="r" data-l="Coletado total">${N(s.tot)}</td><td data-l="Coletado por">${s.mo?`<span class="${s.other?"other-driver":""}">${esc(s.mo)}</span>`:"—"}</td><td class="r" data-l="Adiantado">${N(s.adi)}</td><td class="r" data-l="Justificado">${N(s.jus)}</td><td class="r ${s.pen>0?"pending-num":""}" data-l="Em rota">${N(s.pen)}</td><td class="r" data-l="Visita">${perfCell(s.pv)}</td><td class="clickcell" data-l="Status" data-setf="st" data-v="${esc(s.st)}">${stPill(s.st,s.pen>0)}</td><td data-l="Observação" title="${esc(s.jtxt)}">${esc(s.jtxt)||"—"}</td></tr>`).join("")||`<tr><td colspan="18" class="empty">Nenhum seller encontrado</td></tr>`}</tbody></table></div><div class="pager"><span>${N(list.length)} sellers · página ${S.tPage+1} de ${pages}</span><span style="display:flex;gap:6px"><button class="btn" data-pg="-1" ${S.tPage?"":"disabled"}>Anterior</button><button class="btn" data-pg="1" ${S.tPage<pages-1?"":"disabled"}>Próxima</button></span></div>`;
}
function pendData(rows){
  const pendingKeys=new Set(sellerAgg(rows).filter(s=>s.sit==="Pendente").map(s=>s.sid+"|"+s.cli));
  const bySeller=groupBy(rows.filter(r=>r.pen>0&&pendingKeys.has(sKey(r))),r=>r.ma+"‖"+sKey(r)).map(g=>{const f=g.rows[0];const all=rows.filter(r=>sKey(r)===sKey(f)&&r.ma===f.ma);const a=sum(all);return {ma:f.ma,seller:f.seller,sid:f.sid,cli:f.cli,end:f.end,bai:f.bai,cid:f.cid,cep:f.cep,reg:f.reg,pri:f.pri,st:f.st,pen:g.pen,prev:a.prev,col:a.col,jus:a.jus,mo:[...new Set(all.filter(r=>r.tot>0).map(r=>nameOf(r.mo)))].join(" / "),wbs:g.rows.map(r=>r.wb).filter(Boolean)}});
  const m=new Map();for(const s of bySeller){if(!m.has(s.ma))m.set(s.ma,{ma:s.ma,pen:0,list:[]});const d=m.get(s.ma);d.pen+=s.pen;d.list.push(s)}
  const drivers=[...m.values()].sort((a,b)=>(a.ma===NAO_ATRIB)-(b.ma===NAO_ATRIB)||b.pen-a.pen);drivers.forEach(d=>d.list.sort((a,b)=>b.pen-a.pen));
  return {drivers,bySeller};
}

      <div class="body">${d.list.map(s=>`<div class="sl clickcell" data-setf="sel" data-v="${esc(s.seller)}"><b>${esc(s.seller)}</b><span class="q">${N(s.pen)}<small>de ${N(s.prev)}</small></span><span>${esc(s.end)}${s.bai?" · "+esc(s.bai):""}</span><div class="tags"><span class="pill p-n">${esc(s.cli)}</span><span class="pill p-n">${esc(s.reg)}</span>${s.pri&&s.pri!=="Normal"?`<span class="pill p-warn">${esc(s.pri)}</span>`:""}${stPill(s.st,true)}${s.mo?`<span class="pill p-ok">Coletou: ${esc(s.mo)}</span>`:""}</div></div>`).join("")}</div></div>`}).join(""):`<div class="state"><h2>Nada pendente</h2><p>${q?"Nenhum resultado para essa busca.":"Todos os pacotes previstos foram coletados ou justificados."}</p></div>`}</section>`;

function csv(rowsArr,head,name){const e=v=>{v=String(v??"");return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};const body="\uFEFF"+[head.map(e).join(";"),...rowsArr.map(r=>r.map(e).join(";"))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function bindTable(){
  document.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort;S.tSort=S.tSort.k===k?{k,d:-S.tSort.d}:{k,d:["seller","cli","ma","end","cid","bai","cep","reg","mo","st","jtxt"].includes(k)?1:-1};S.tPage=0;$("#sTable").innerHTML=sellerTable(sellerAgg(applyF(baseRows())));bindTable()});
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{S.tPage+=+b.dataset.pg;$("#sTable").innerHTML=sellerTable(sellerAgg(applyF(baseRows())));bindTable();$("#sellersCard").scrollIntoView({behavior:"smooth",block:"start"})});
}
function animate(){
  const red=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const g=$("#gArc");if(g){if(red)g.style.strokeDashoffset=g.dataset.target;else requestAnimationFrame(()=>requestAnimationFrame(()=>g.style.strokeDashoffset=g.dataset.target))}
  document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,pct=el.dataset.pct;const fmt=v=>pct?v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%":N(v);
    if(red||!isFinite(to)){el.textContent=isFinite(to)?fmt(to):"—";return}
    const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);el.textContent=fmt(pct?to*e:Math.round(to*e));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
}
function go(v){S.view=v;try{history.replaceState(null,"",v==="pend"?"#pendentes":location.pathname+location.search)}catch(e){}renderMain();window.scrollTo({top:0})}
$("#btnPend").onclick=()=>go("pend");
$("#btnHome").onclick=()=>go("home");
window.addEventListener("hashchange",()=>{const v=location.hash==="#pendentes"?"pend":"home";if(v!==S.view){S.view=v;renderMain()}});
if(!window.GL_BLOQ)loadAll().catch(e=>{console.warn(e);showEmpty()});
</script>
</body>
</html>

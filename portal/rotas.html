<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotas | GETLOG</title>
<style>
:root{--nav:#06183D;--lar:#F86800;--bg:#F4F6FA;--tit:#002060;--bd:#E3E8EF;--mut:#6B7790;--ok:#16803C;--er:#C0342B}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:#0E1F45;font:14px/1.4 Inter,'Segoe UI',Arial,sans-serif}
header{background:var(--nav);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:18px}
header span{border-left:3px solid var(--lar);padding-left:10px}
main{max-width:none;margin:0;padding:0 16px 12px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--bd);background:#fff;margin:0 -16px 12px;padding:0 16px;overflow-x:auto}
.aba{padding:14px 18px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.aba.on{color:var(--tit);border-bottom-color:var(--lar)}
.sub{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.stb{padding:7px 14px;border:1px solid var(--bd);background:#fff;border-radius:999px;font-weight:600;color:var(--tit);cursor:pointer}
.stb.on{background:var(--tit);border-color:var(--tit);color:#fff}
.panel{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
input,select{height:36px;border:1px solid #CBD3DF;border-radius:7px;padding:0 10px;font:inherit;background:#fff;color:#0E1F45}
input:focus,select:focus{outline:0;border-color:var(--tit)}
.fbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.1fr) auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px}
.fbar #q,.fbar #fcep{width:100%;min-width:0}
.fbar #q{grid-column:1/-1;height:46px;font-size:15px;padding:0 14px;border-radius:9px}
@media(max-width:1180px){.fbar{grid-template-columns:repeat(4,minmax(0,1fr))}.fbar #q{grid-column:1/-1}.fbar #fcep{grid-column:span 2}.fbar #limpar{grid-column:span 2;justify-self:end}}
@media(max-width:700px){.fbar{grid-template-columns:repeat(2,minmax(0,1fr))}.fbar #fcep,.fbar #limpar{grid-column:auto}}
.dd{position:relative}
.ddb{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:1px solid #CBD3DF;background:#fff;border-radius:7px;padding:0 10px;height:36px;font-size:13px;color:#2F3F63;white-space:nowrap}
.ddb>span{flex:1;text-align:left}
.ddb:hover{border-color:var(--mut)}
.ddb span{overflow:hidden;text-overflow:ellipsis}
.ddb.on{border-color:var(--tit);background:#E8EDF9;color:var(--tit);font-weight:600}
.ddb .c{background:var(--tit);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}
.ddb .cv{width:12px;height:12px;opacity:.55;transition:transform .18s ease}
.ddb[aria-expanded="true"] .cv{transform:rotate(180deg)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 36px rgba(6,22,66,.18);min-width:270px}
.pop.r{left:auto;right:0}
.ms-s{padding:8px;border-bottom:1px solid #EDF0F5}
.ms-s input{width:100%;height:34px}
.ms-o{display:flex;gap:6px;padding:8px 10px 0}
.ord{flex:1;border:1px solid #CBD3DF;background:#fff;border-radius:7px;padding:5px 0;font-size:12.5px;font-weight:600;color:var(--mut)}
.ord.on{background:#E8EDF9;border-color:var(--tit);color:var(--tit)}
.ms-a{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #EDF0F5}
.lnk{background:none;border:0;color:var(--tit);font-weight:600;font-size:12.5px;padding:2px}
.lnk:hover{text-decoration:underline}
.ms-l{max-height:270px;overflow:auto;padding:4px}
.ms-l label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.ms-l label:hover{background:var(--bg)}
.ms-l input{accent-color:var(--tit);width:15px;height:15px;flex:none;padding:0}
.ms-l label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-l label em{font-style:normal;color:var(--mut);font-size:12px}
.ms-e{padding:14px;color:var(--mut);text-align:center;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:4px 8px 4px 10px;font-size:12px;color:#2F3F63}
.chip button{border:0;background:transparent;color:var(--mut);font-weight:700;padding:0;line-height:1}
.chip button:hover{color:var(--er)}
@media(max-width:560px){.pop{position:fixed;left:12px!important;right:12px!important;top:auto;bottom:12px;width:auto;max-height:70vh}}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--tit);font-weight:600;padding:6px}
.link.u{text-decoration:underline}
.btn{height:40px;padding:0 20px;border:0;border-radius:8px;background:var(--lar);color:#fff;font-weight:700}
.btn.sec{background:#fff;color:var(--tit);border:1px solid #CBD3DF}
.btn.esc{background:var(--nav)}
.tool{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.tool h2{margin:0;font-size:16px;color:var(--tit)}
.tool h2 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.tool .dir{display:flex;gap:8px;align-items:center;position:relative;flex-wrap:wrap}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(6,24,61,.18);min-width:260px;z-index:5;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--tit);font-weight:600}
.menu button:hover:not(:disabled){background:#EEF3FC}
.alerta{background:#FDECEA;border:1px solid #F5C2BE;border-radius:8px;padding:10px 12px;margin:0 0 8px;color:#8E2A22;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.faixa{background:#FFF3EA;border:1px solid #FFD9BD;border-radius:8px;padding:8px 12px;margin:0 0 8px;color:var(--tit)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px}
th{position:sticky;top:0;background:#F4F6FA;text-align:left;font-size:12.5px;color:var(--tit);padding:9px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F8FAFD}
tbody tr.sel{background:#FFF3EA;box-shadow:inset 3px 0 0 var(--lar)}
td.c,th.c{width:44px;text-align:center}
td.c input,th.c input{width:18px;height:18px;padding:0;accent-color:var(--lar)}
.s{font-weight:700;color:var(--tit)}
.m{color:var(--mut)}
.num{text-align:right;white-space:nowrap}
.cls span{display:inline-block;background:#EEF3FC;border-radius:999px;padding:1px 7px;font-size:11px;margin:1px 4px 1px 0;white-space:nowrap}
.mot{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--tit);white-space:nowrap}
.mot.alt{font-weight:500}
.mot.sug{border-style:dashed;color:var(--mut);font-weight:500}
.mot.vz{color:var(--mut);font-weight:500}
.noalt .calt,.noalt .sub3{display:none!important}
.sub2{display:none;font-size:11.5px;margin-top:2px}
.compact .sub2{display:block}
.sub3{display:none;margin-top:4px;white-space:nowrap}
.sub3 small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.compact2 .sub3{display:block}
.compact2 .calt{display:none}
.sub4{display:none!important}
.compact3 .cmd{display:none}
.compact3 .sub4{display:inline-block!important;background:none!important;color:var(--mut)!important}
.compact .ccl,.compact .cb,.compact .cc,.compact .cp{display:none}
.tag{display:inline-block;color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:6px;margin-bottom:8px}
.tag.o{background:var(--lar)}
.tag.a{background:var(--tit)}
#dt{font-size:20px;font-weight:800;color:var(--tit);line-height:1.2}
#dsub{margin-top:4px;color:#4A5872;font-size:13.5px}
#dsub b{color:var(--tit)}
.dl.o{border-top:6px solid var(--lar)}
.dl.a{border-top:6px solid var(--tit)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.xb{border:0;background:none;font-size:24px;line-height:1;color:var(--mut);padding:0 4px;margin:-4px -4px 0 0}
.xb:hover{color:var(--tit)}
#dx{height:48px;font-size:15px;width:100%}
.mot.sem{background:#FDECEA;border-color:#F5C2BE;color:var(--er)}
.pag{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 0;color:var(--mut);flex-wrap:wrap}
.pag select{width:auto;height:36px}
.pag .dir{display:flex;gap:8px;align-items:center}
.vazio{padding:28px;text-align:center;color:var(--mut)}
body{padding-bottom:84px}
.acao{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;justify-content:center;align-items:center;z-index:4}
dialog{border:0;border-radius:14px;width:min(560px,calc(100vw - 24px));padding:0;max-height:88vh}
dialog::backdrop{background:rgba(6,24,61,.5)}
.dl{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:88vh}
.lista{overflow:auto;flex:1;min-height:260px}
.op{padding:11px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.op:hover{background:#EEF3FC}
.op small{color:var(--mut)}
.gr{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--lar);padding:8px 10px 2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:12px 16px;border-radius:10px;display:none;gap:14px;align-items:center;max-width:92vw;z-index:9}
#toast.er{background:var(--er)}
#toast button{background:none;border:0;color:#FFB27A;font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<header><h1><span>Rotas</span></h1><div id="usr" class="m" style="color:#C9D2E3"></div></header>
<main>
<div class="abas"><button class="aba" data-b="semana">GERAL - SEGUNDA A SEXTA</button><button class="aba" data-b="ee">EU ENTREGO - SEGUNDA A SEXTA</button><button class="aba" data-b="sabado">GERAL - SÁBADO</button><button class="aba" data-b="ee_sabado">EU ENTREGO - SÁBADO</button></div>
<div id="msg" class="vazio" hidden></div>
<div id="painel" hidden>

<div class="fbar"><input id="q" type="search" placeholder="Buscar seller, rua, bairro, CEP ou cidade" autocomplete="off"><span id="dds" style="display:contents"></span><input id="fcep" type="search" inputmode="numeric" placeholder="CEP começa com" autocomplete="off"><button class="link u" id="limpar">Limpar tudo</button></div>
<div class="chips" id="chips"></div>
<div class="tool">
<h2>Lista de sellers <small id="cont"></small></h2>
<div class="dir">
<button class="btn sec" id="exportar">Exportar</button>
<button class="btn sec" id="sinc">Sincronizar com a planilha</button>
<button class="btn sec" id="gsug">Gravar alternativos sugeridos</button>
<button class="btn esc" id="atrib">Atribuir motoristas &#9662;</button>
<div class="menu" id="menu" hidden><button id="m1"></button><button id="m2"></button><button id="m3"></button></div>
</div>
</div>
<div class="alerta" id="alerta" hidden></div>
<div class="faixa" id="faixa" hidden></div>
<div class="tw"><table><thead><tr><th class="c"><input type="checkbox" id="tudo" title="Selecionar os sellers desta página"></th><th>Seller</th><th class="ccl">Clientes</th><th>Endereço</th><th class="cb">Bairro</th><th class="cc">Cidade</th><th class="cp">CEP</th><th class="num cmd">Média</th><th>Motorista</th><th class="calt">Motorista alternativo</th></tr></thead><tbody id="lista"></tbody></table></div>
<div class="pag"><span id="pinfo"></span><span class="dir"><label for="tam">Por página</label><select id="tam"><option>50</option><option selected>100</option><option>200</option><option>500</option></select><button class="btn sec" id="ant">Anterior</button><span id="pn"></span><button class="btn sec" id="prox">Próxima</button></span></div>
</div>
</main>
<div class="acao" id="acao" hidden><b id="nsel"></b><button class="btn" id="trocar"></button><button class="btn sec" id="lsel">Limpar seleção</button></div>
<dialog id="dlg"><div class="dl">
<div class="dh"><div><span id="dtag" class="tag"></span><div id="dt"></div><div id="dsub"></div></div><button class="xb" id="dxx" aria-label="Fechar">&times;</button></div>
<input id="dq" type="search" placeholder="Digite parte do nome do motorista" autocomplete="off">
<div class="lista" id="dl"></div>
<button class="btn sec" id="dx">Cancelar</button>
</div></dialog>
<div id="toast"><span id="tm"></span><button id="tu">Desfazer</button></div>
<script>
const PP=(()=>{try{return window.parent!==window?window.parent:null}catch(e){return null}})();
const CP=(PP&&PP.GETLOG_ROTAS)||{};
const CFG={api:CP.api||'COLE_AQUI_A_URL_DO_WEB_APP',token:CP.token||'COLE_AQUI_O_TOKEN',usuarioPortal:()=>window.GETLOG_USUARIO||(PP&&PP.GETLOG_USUARIO)||localStorage.getItem('getlog_usuario')};
const CONFIGURADO=/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.api)&&CFG.token.indexOf('COLE_AQUI')<0;
// Chamada ao Apps Script com limite de tempo e novas tentativas (só quando é seguro repetir)
async function chamar(url,opt,tent,tmo){
  let ult;
  for(let i=0;i<=tent;i++){
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),tmo);
    try{
      const x=await fetch(url,{...opt,signal:ac.signal});
      if(!x.ok)throw new Error('http '+x.status);
      return await x.json();
    }catch(e){ult=e;if(i<tent)await new Promise(ok=>setTimeout(ok,800*(i+1)))}
    finally{clearTimeout(t)}
  }
  throw ult;
}
const $=id=>document.getElementById(id);
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const curto=m=>m?m.replace(/^GET\s*-\s*/i,''):'Sem motorista';
const BASES_OK=['semana','sabado','ee','ee_sabado'];
const S={base:BASES_OK.includes(localStorage.getItem('rotas_base'))?localStorage.getItem('rotas_base'):'semana',linhas:[],mots:[],sel:new Set(),q:'',f:{mot:new Set(),cli:new Set(),cid:new Set(),bai:new Set()},fcep:'',st:'todos',pop:null,pq:'',ord:{mot:'az',cli:'az',cid:'az',bai:'az'},pag:1,lim:100,ult:-1,desfazer:null};
let usuario=CFG.usuarioPortal();
if(!usuario){usuario=prompt('Seu nome para registrar as alterações:')||'Sem identificação';localStorage.setItem('getlog_usuario',usuario)}
$('usr').textContent=usuario;
const h=location.hash.match(/motorista=([^&]+)/);
if(h)S.f.mot.add(decodeURIComponent(h[1]));
function aplicar(r){
  const MA=x=>String(x==null?'':x).trim().toUpperCase();
  S.linhas=r.linhas.map(l=>({...l,seller:MA(l.seller),cep:String(l.cep==null?'':l.cep),endereco:l.endereco==null?'':l.endereco,bairro:l.bairro==null?'':l.bairro,cidade:l.cidade==null?'':l.cidade,clientes:(l.clientes||[]).map(MA),motorista:l.motorista||'',alt:l.alternativo||'',_b:norm([l.seller,l.endereco,l.bairro,l.cep,l.cidade].join(' '))}));
  S.mots=r.motoristas||[];
  // Ranking de motoristas por região (CEP de 5 dígitos, bairro, cidade): base das sugestões
  const reg={cep:{},bai:{},cid:{}};
  S.linhas.forEach(l=>{if(!l.motorista)return;const k=chaveReg(l);for(const t in reg)if(k[t]){const o=reg[t][k[t]]=reg[t][k[t]]||{};o[l.motorista]=(o[l.motorista]||0)+1}});
  S.reg=reg;S.rk={};
}
function aplicar0(){const reg={cep:{},bai:{},cid:{}};S.linhas.forEach(l=>{if(!l.motorista)return;const k=chaveReg(l);for(const t in reg)if(k[t]){const o=reg[t][k[t]]=reg[t][k[t]]||{};o[l.motorista]=(o[l.motorista]||0)+1}});S.reg=reg;S.rk={}}
function chaveReg(l){return {cep:l.cep.replace(/\D/g,'').slice(0,5),bai:norm(l.bairro),cid:norm(l.cidade)}}
// Motoristas da região do seller, do que mais atende para o que menos atende (sem o motorista oficial dele)
function rankRegiao(l){
  const k=chaveReg(l);
  for(const t of ['cep','bai','cid']){
    if(!k[t])continue;const c=S.reg[t][k[t]];if(!c)continue;
    const id=t+k[t];
    const lista=(S.rk[id]=S.rk[id]||Object.keys(c).sort((a,b)=>c[b]-c[a])).filter(m=>m!==l.motorista&&S.mots.includes(m));
    if(lista.length)return lista;
  }
  return [];
}
const altSug=l=>l.alt?'':(rankRegiao(l)[0]||'');
// Como nas outras telas: qualquer clique aqui dentro recolhe o menu lateral do portal
addEventListener('click',()=>{try{parent!==window&&parent.GL_SIDE_HIDE&&parent.GL_SIDE_HIDE()}catch(e){}},true);
// Cópia só da sessão desta aba (some ao fechar o navegador): a tela abre na hora e atualiza em segundo plano
const CK=()=>'rotas_cache_'+S.base;
async function buscar(){
  const r=await chamar(CFG.api+'?token='+encodeURIComponent(CFG.token)+'&base='+S.base,{},2,30000);
  if(r.erro||!Array.isArray(r.linhas))throw new Error(r.erro||'resposta inválida');
  aplicar(r);
  S.em=Date.now();
  try{sessionStorage.setItem(CK(),JSON.stringify({linhas:r.linhas,motoristas:r.motoristas}))}catch(e){}
}
// Atualização silenciosa: mantém busca, filtro e seleção; nunca roda durante um salvamento
async function recarregar(){
  if(S.ocupado||!CONFIGURADO)return;
  try{await buscar()}catch(e){return}
  const ks=new Set(S.linhas.map(l=>l.k));[...S.sel].forEach(k=>ks.has(k)||S.sel.delete(k));
  desenharFiltros();desenhar();
}
function mostrar(msg){
  $('msg').innerHTML=msg||'';$('msg').hidden=!msg;$('painel').hidden=!!msg;$('acao').hidden=true;
}
async function carregar(){
  if(!CONFIGURADO){mostrar('A tela Rotas ainda não foi configurada. Peça ao administrador para informar a URL e o token em Usuários e acessos &gt; Configurações do sistema.');return}
  S.sel.clear();S.pag=1;
  let rapido=false;
  try{const c=JSON.parse(sessionStorage.getItem(CK())||'null');if(c&&Array.isArray(c.linhas)){aplicar(c);rapido=true;mostrar('');desenharFiltros();desenhar();S.em=Date.now()-240000}}catch(e){}
  if(!rapido)mostrar('Carregando...');
  try{
    await buscar();
  }catch(e){if(rapido)return;mostrar('Não foi possível carregar os dados. Confira a conexão e tente de novo.<br><button class="btn sec" id="tent" style="margin-top:12px">Tentar de novo</button>');$('tent').onclick=carregar;return}
  mostrar('');desenharFiltros();desenhar();
}
// Filtros de seleção múltipla (mesmo modelo da Performance): pesquisar, selecionar todos/limpar, contagem que respeita os outros filtros
const FILTROS=[['mot','Motorista'],['cli','Cliente'],['cid','Cidade'],['bai','Bairro']];
const SEMV={mot:'',cli:'Sem cliente',cid:'Sem cidade',bai:'Sem bairro'};
const valores=(k,l)=>k==='mot'?[l.motorista||'']:k==='cli'?(l.clientes.length?l.clientes:['Sem cliente']):k==='cid'?[l.cidade||'Sem cidade']:[l.bairro||'Sem bairro'];
const rotuloV=(k,v)=>k==='mot'?curto(v):v;
function passa(l,skip){
  const t=norm(S.q).split(/\s+/).filter(Boolean);
  for(const [k] of FILTROS){if(k===skip||!S.f[k].size)continue;if(!valores(k,l).some(v=>S.f[k].has(v)))return false}
  if(S.fcep&&!l.cep.replace(/\D/g,'').startsWith(S.fcep.replace(/\D/g,'')))return false;
  if(skip!=='st'){if(S.st==='sem'&&l.motorista)return false;if(S.st==='com'&&!l.motorista)return false}
  return t.every(x=>l._b.includes(x));
}
function filtradas(){
  return S.linhas.filter(l=>passa(l)).sort((a,b)=>a.cep.localeCompare(b.cep)||a.seller.localeCompare(b.seller));
}
function opcoesDe(k){
  const m=new Map();
  S.linhas.forEach(l=>{if(passa(l,k))valores(k,l).forEach(v=>m.set(v,(m.get(v)||0)+1))});
  S.f[k].forEach(v=>{if(!m.has(v))m.set(v,0)});
  const sg=S.ord[k]==='za'?-1:1;
  return [...m.entries()].sort((a,b)=>sg*rotuloV(k,a[0]).localeCompare(rotuloV(k,b[0]),'pt-BR'));
}
function popHTML(k){
  const q=norm(S.pq),todas=opcoesDe(k),lista=q?todas.filter(([v])=>norm(rotuloV(k,v)).includes(q)):todas;
  const itens=lista.map(([v,c])=>'<label><input type="checkbox" data-v="'+esc(v)+'"'+(S.f[k].has(v)?' checked':'')+'><span>'+esc(rotuloV(k,v))+'</span><em>'+c+'</em></label>').join('');
  return '<div class="pop'+(k==='cid'||k==='bai'?' r':'')+'" role="listbox" aria-multiselectable="true"><div class="ms-s"><input id="msq" type="search" placeholder="Pesquisar" value="'+esc(S.pq)+'" autocomplete="off"></div><div class="ms-o"><button class="ord'+(S.ord[k]!=='za'?' on':'')+'" data-ord="az">A-Z</button><button class="ord'+(S.ord[k]==='za'?' on':'')+'" data-ord="za">Z-A</button></div><div class="ms-a"><button class="lnk" data-ms="all">Selecionar '+(q?'resultados':'todos')+'</button><button class="lnk" data-ms="none">Limpar</button></div><div class="ms-l">'+(itens||'<div class="ms-e">Nenhuma opção encontrada</div>')+'</div></div>';
}
const CV='<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function desenharFiltros(){
  $('dds').innerHTML=FILTROS.map(([k,r])=>{const n=S.f[k].size;return '<div class="dd"><button class="ddb'+(n?' on':'')+'" data-pop="'+k+'" aria-haspopup="listbox" aria-expanded="'+(S.pop===k)+'"><span>'+r+'</span>'+(n?'<b class="c">'+n+'</b>':'')+CV+'</button>'+(S.pop===k?popHTML(k):'')+'</div>'}).join('');
  const ch=[];FILTROS.forEach(([k,r])=>S.f[k].forEach(v=>ch.push('<span class="chip"><b>'+r+':</b> '+esc(rotuloV(k,v))+'<button data-chip="'+k+'" data-v="'+esc(v)+'" aria-label="Remover filtro">&times;</button></span>')));
  $('chips').innerHTML=ch.join('');
  const pp=document.querySelector('.pop');
  if(pp){pp.classList.remove('r');if(pp.getBoundingClientRect().right>innerWidth-8)pp.classList.add('r')}
  const q=$('msq');if(q&&S.foco){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
// Sugestão por região: o motorista que mais atende o mesmo CEP (5 dígitos), depois o mesmo bairro, depois a mesma cidade
function sugestoes(){
  const reg={cep:{},bai:{},cid:{}},kk=l=>({cep:l.cep.replace(/\D/g,'').slice(0,5),bai:norm(l.bairro),cid:norm(l.cidade)});
  S.linhas.forEach(l=>{if(!l.motorista)return;const k=kk(l);for(const t in reg)if(k[t]){const o=reg[t][k[t]]=reg[t][k[t]]||{};o[l.motorista]=(o[l.motorista]||0)+1}});
  const top=o=>o?Object.keys(o).sort((a,b)=>o[b]-o[a])[0]:'';
  const out=[];
  S.linhas.forEach(l=>{if(l.motorista)return;const k=kk(l),m=(k.cep&&top(reg.cep[k.cep]))||(k.bai&&top(reg.bai[k.bai]))||(k.cid&&top(reg.cid[k.cid]));if(m&&S.mots.includes(m))out.push({k:l.k,motorista:m})});
  return out;
}
const plural=(n,a,b)=>n+' '+(n===1?a:b);
function celAlt(l){
  if(l.alt)return '<button class="mot alt" data-ua="1">'+esc(curto(l.alt))+'</button>';
  const g=altSug(l);
  return g?'<button class="mot sug" data-ua="1" title="Sugerido pela região. Clique para gravar ou trocar">'+esc(curto(g))+'</button>':'<button class="mot vz" data-ua="1">Definir</button>';
}
function ajusta(){
  // Tudo na tela, sem cortar nem quebrar texto: se não couber em colunas separadas, bairro, cidade, CEP e clientes passam para uma segunda linha
  const t=$('lista').closest('table'),w=t.parentElement;
  t.classList.remove('compact');
  t.classList.remove('compact2');
  if(w.scrollWidth>w.clientWidth+1)t.classList.add('compact');
  if(w.scrollWidth>w.clientWidth+1)t.classList.add('compact2');
  t.classList.remove('compact3');
  if(w.scrollWidth>w.clientWidth+1)t.classList.add('compact3');
}
addEventListener('resize',()=>ajusta());
function desenhar(){
  $('lista').closest('table').classList.toggle('noalt',S.base.startsWith('ee'));
  document.querySelectorAll('.aba').forEach(a=>a.classList.toggle('on',a.dataset.b===S.base));
  const base=S.linhas.filter(l=>passa(l,'st')),nSem=base.filter(l=>!l.motorista).length;
  const rot={todos:'Todos ('+base.length+')',sem:'Sem motorista ('+nSem+')',com:'Com motorista ('+(base.length-nSem)+')'};
  document.querySelectorAll('.stb').forEach(b=>{b.textContent=rot[b.dataset.st];b.classList.toggle('on',b.dataset.st===S.st)});
  const f=filtradas(),np=Math.max(1,Math.ceil(f.length/S.lim));
  if(S.pag>np)S.pag=np;
  const ini=(S.pag-1)*S.lim,vis=f.slice(ini,ini+S.lim);
  S.vis=vis;
  $('cont').textContent='Exibindo '+vis.length+' de '+f.length+(f.length===1?' resultado':' resultados');
  $('lista').innerHTML=vis.map(l=>'<tr data-k="'+esc(l.k)+'" class="'+(S.sel.has(l.k)?'sel':'')+'"><td class="c"><input type="checkbox"'+(S.sel.has(l.k)?' checked':'')+'></td><td class="s">'+esc(l.seller)+'<div class="sub2 cls">'+l.clientes.map(c=>'<span>'+esc(c)+'</span>').join('')+(l.media?'<span class="sub4">média '+l.media.toLocaleString('pt-BR')+'</span>':'')+'</div></td><td class="cls ccl">'+l.clientes.map(c=>'<span>'+esc(c)+'</span>').join('')+'</td><td>'+esc(l.endereco)+'<div class="sub2 m">'+[l.bairro,l.cidade,l.cep].filter(Boolean).map(esc).join(' &middot; ')+'</div></td><td class="m cb">'+esc(l.bairro)+'</td><td class="m cc">'+esc(l.cidade)+'</td><td class="m cp">'+esc(l.cep)+'</td><td class="num m cmd">'+(l.media?l.media.toLocaleString('pt-BR'):'')+'</td><td><button class="mot'+(l.motorista?'':' sem')+'" data-um="1">'+esc(curto(l.motorista))+'</button><div class="sub3"><small>Alternativo</small> '+celAlt(l)+'</div></td><td class="calt">'+celAlt(l)+'</td></tr>').join('')||'<tr><td colspan="10" class="vazio">Nenhum seller com esses filtros.</td></tr>';
  const nv=vis.filter(l=>S.sel.has(l.k)).length,tudo=$('tudo');
  tudo.checked=vis.length>0&&nv===vis.length;tudo.indeterminate=nv>0&&nv<vis.length;
  const todosF=f.length>0&&f.every(l=>S.sel.has(l.k));
  const fx=$('faixa');
  if(todosF&&f.length>vis.length){fx.hidden=false;fx.innerHTML='Todos os '+f.length+' sellers do filtro estão selecionados. <button class="link u" id="fl">Limpar seleção</button>'}
  else if(nv===vis.length&&nv>0&&f.length>vis.length){fx.hidden=false;fx.innerHTML=plural(nv,'seller selecionado','sellers selecionados')+' nesta página. <button class="link u" id="fs">Selecionar os '+f.length+' sellers do filtro</button>'}
  else fx.hidden=true;
  $('pinfo').textContent=f.length?('Mostrando '+(ini+1)+' a '+(ini+vis.length)+' de '+f.length):'';
  $('pn').textContent='Página '+S.pag+' de '+np;$('ant').disabled=S.pag<=1;$('prox').disabled=S.pag>=np;
  $('m3').textContent='Alternativo dos '+plural(S.sel.size,'selecionado','selecionados');$('m3').disabled=!S.sel.size||S.base.startsWith('ee');
  const nSug=S.base.startsWith('ee')?0:S.linhas.filter(l=>!l.alt&&altSug(l)).length;$('gsug').hidden=!nSug;$('gsug').textContent='Gravar sugeridos ('+nSug+')';$('gsug').title='Gravar na planilha o motorista alternativo sugerido pela região';
  $('m1').textContent='Aos '+plural(S.sel.size,'selecionado','selecionados');$('m1').disabled=!S.sel.size;
  $('m2').textContent='A todos os '+f.length+' do filtro';$('m2').disabled=!f.length;
  const pend=S.linhas.filter(l=>!l.motorista).length,sug=pend?sugestoes().length:0;
  $('alerta').hidden=!pend;
  if(pend)$('alerta').innerHTML='<span><b>ATENÇÃO:</b> '+plural(pend,'seller está','sellers estão')+' sem motorista.'+(sug?' Há sugestão pela região para '+sug+'.':' Nenhuma região parecida para sugerir; use Atribuir motoristas.')+'</span>'+(sug?'<button class="btn" id="preencher">Preencher por região ('+sug+')</button>':'');
  $('acao').hidden=!S.sel.size;
  $('nsel').textContent=plural(S.sel.size,'seller selecionado','sellers selecionados');
  $('trocar').textContent='Atribuir motorista';
  ajusta();
}
function abrirTroca(keys,modo){
  S.alvo=keys;S.modo=modo||'mot';
  const alt=S.modo==='alt',rows=S.linhas.filter(l=>keys.includes(l.k));
  $('dlg').querySelector('.dl').className='dl '+(alt?'a':'o');
  $('dtag').className='tag '+(alt?'a':'o');$('dtag').textContent=alt?'ESCOLHER MOTORISTA ALTERNATIVO':'ESCOLHER MOTORISTA OFICIAL';
  if(rows.length===1){const l=rows[0];$('dt').textContent=l.seller;$('dsub').innerHTML=alt?'Motorista oficial: <b>'+esc(curto(l.motorista))+'</b> &middot; Alternativo atual: <b>'+esc(l.alt?curto(l.alt):'nenhum')+'</b>':'Motorista atual: <b>'+esc(curto(l.motorista))+'</b>'}
  else{$('dt').textContent=rows.length+' SELLERS SELECIONADOS';$('dsub').textContent='A escolha abaixo vale para todos os sellers selecionados.'}
  const cep=new Set(rows.map(l=>l.cep.slice(0,5))),ofi=new Set(rows.map(l=>l.motorista));
  const c={};S.linhas.forEach(l=>{if(l.motorista&&cep.has(l.cep.slice(0,5)))c[l.motorista]=(c[l.motorista]||0)+1});
  const sug=Object.keys(c).filter(m=>!(alt&&rows.length===1&&ofi.has(m))).sort((a,b)=>c[b]-c[a]);
  S.ops=(alt?[{m:'',det:'',g:'Sem alternativo',rm:1}]:[]).concat(sug.map(m=>({m,det:c[m]+(c[m]===1?' seller':' sellers')+' na região',g:'Sugeridos para esta região'})),S.mots.filter(m=>!c[m]&&!(alt&&rows.length===1&&ofi.has(m))).map(m=>({m,det:'',g:'Outros motoristas'})));
  $('dq').value='';desenharOps();
  $('dlg').showModal();
}
function desenharOps(){
  const t=norm($('dq').value).split(/\s+/).filter(Boolean);
  let g='',o='';
  S.ops.filter(x=>x.rm||t.every(y=>norm(x.m).includes(y))).slice(0,300).forEach(x=>{
    if(x.g!==g){g=x.g;o+='<div class="gr">'+g+'</div>'}
    o+='<div class="op" data-m="'+esc(x.m)+'"><span>'+(x.rm?'Remover alternativo':esc(x.m))+'</span><small>'+esc(x.det)+'</small></div>';
  });
  $('dl').innerHTML=o||'<div class="vazio">Nenhum motorista encontrado.</div>';
}
async function salvar(mudancas,msg){
  const toast=(t,er,u)=>{$('tm').textContent=t;$('toast').className=er?'er':'';$('tu').hidden=!u;$('toast').style.display='flex';clearTimeout(S.tt);S.tt=setTimeout(()=>$('toast').style.display='none',9000)};
  const ant=mudancas.map(m=>({k:m.k,campo:m.campo,motorista:S.linhas.find(l=>l.k===m.k)[m.campo==='alt'?'alt':'motorista']}));
  const aplicar=lst=>lst.forEach(m=>{S.linhas.find(l=>l.k===m.k)[m.campo==='alt'?'alt':'motorista']=m.motorista});
  aplicar(mudancas);S.reg&&aplicar0();desenharFiltros();desenhar();
  S.ocupado=true;
  try{
    // gravar o mesmo motorista duas vezes não muda nada, então repetir uma vez é seguro
    const r=await chamar(CFG.api,{method:'POST',body:JSON.stringify({token:CFG.token,base:S.base,usuario,mudancas})},1,40000);
    if(!r.ok)throw new Error(r.erro||'falha');
    if(r.rejeitados.length){toast('Salvo, mas '+r.rejeitados.length+(r.rejeitados.length===1?' não foi aceito':' não foram aceitos')+'. Lista atualizada.',true,false);S.ocupado=false;await recarregar()}
    else toast('Salvo: '+msg,false,true);
    S.desfazer=ant;
  }catch(e){
    aplicar(ant);aplicar0();desenharFiltros();desenhar();
    toast('Não foi possível salvar. Nada foi alterado.',true,false);
  }
  S.ocupado=false;
}
$('lista').addEventListener('click',e=>{
  const c=e.target.closest('tr[data-k]');if(!c)return;
  const k=c.dataset.k;
  if(e.target.closest('[data-um]')){abrirTroca([k]);return}
  if(e.target.closest('[data-ua]')){abrirTroca([k],'alt');return}
  const ix=S.vis.findIndex(l=>l.k===k);
  if(e.shiftKey&&S.ult>=0&&S.ult<S.vis.length){
    const [a,b]=[Math.min(S.ult,ix),Math.max(S.ult,ix)],marca=!S.sel.has(k);
    S.vis.slice(a,b+1).forEach(l=>marca?S.sel.add(l.k):S.sel.delete(l.k));
  }else S.sel.has(k)?S.sel.delete(k):S.sel.add(k);
  S.ult=ix;desenhar();
});
$('tudo').onclick=()=>{const t=S.vis.every(l=>S.sel.has(l.k));S.vis.forEach(l=>t?S.sel.delete(l.k):S.sel.add(l.k));desenhar()};
$('faixa').addEventListener('click',e=>{
  if(e.target.id==='fs')filtradas().forEach(l=>S.sel.add(l.k));
  else if(e.target.id==='fl')S.sel.clear();
  desenhar();
});
const limpaTudo=()=>{FILTROS.forEach(([k])=>S.f[k].clear());S.q=S.fcep='';S.st='todos';S.pop=null;S.pq='';S.pag=1;$('q').value=$('fcep').value='';desenharFiltros();desenhar()};
$('limpar').onclick=limpaTudo;
$('alerta').addEventListener('click',e=>{
  if(e.target.id!=='preencher')return;
  const m=sugestoes();if(!m.length)return;
  if(!confirm('Atribuir pela região o motorista que mais atende o CEP, bairro ou cidade a '+plural(m.length,'seller','sellers')+' sem motorista? Dá para desfazer logo depois.'))return;
  salvar(m,plural(m.length,'seller','sellers')+' por região');
});
$('lsel').onclick=()=>{S.sel.clear();desenhar()};
$('trocar').onclick=()=>abrirTroca([...S.sel]);
const refiltra=()=>{S.pag=1;desenharFiltros();desenhar()};
$('q').oninput=e=>{S.q=e.target.value;S.foco=false;refiltra()};
$('fcep').oninput=e=>{S.fcep=e.target.value;S.foco=false;refiltra()};
document.querySelectorAll('.stb').forEach(b=>b.onclick=()=>{S.st=b.dataset.st;refiltra()});
$('dds').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('[data-pop]');
  if(b){const k=b.dataset.pop;S.pop=S.pop===k?null:k;S.pq='';S.foco=true;desenharFiltros();return}
  const od=e.target.closest('[data-ord]');
  if(od&&S.pop){S.ord[S.pop]=od.dataset.ord;S.foco=false;desenharFiltros();return}
  const ms=e.target.closest('[data-ms]');
  if(ms&&S.pop){const k=S.pop,q=norm(S.pq);
    if(ms.dataset.ms==='none')S.f[k].clear();
    else opcoesDe(k).filter(([v])=>!q||norm(rotuloV(k,v)).includes(q)).forEach(([v])=>S.f[k].add(v));
    refiltra()}
});
$('dds').addEventListener('change',e=>{
  const c=e.target.closest('input[data-v]');if(!c||!S.pop)return;
  c.checked?S.f[S.pop].add(c.dataset.v):S.f[S.pop].delete(c.dataset.v);
  refiltra();
});
$('dds').addEventListener('input',e=>{if(e.target.id==='msq'){S.pq=e.target.value;S.foco=true;desenharFiltros()}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(!b)return;S.f[b.dataset.chip].delete(b.dataset.v);refiltra()});
document.addEventListener('click',()=>{if(S.pop){S.pop=null;desenharFiltros()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pop){S.pop=null;desenharFiltros()}});
$('tam').onchange=e=>{S.lim=+e.target.value;refiltra()};
$('ant').onclick=()=>{S.pag--;desenhar();scrollTo(0,0)};
$('prox').onclick=()=>{S.pag++;desenhar();scrollTo(0,0)};
$('atrib').onclick=e=>{e.stopPropagation();$('menu').hidden=!$('menu').hidden};
document.addEventListener('click',()=>{$('menu').hidden=true});
$('m1').onclick=()=>abrirTroca([...S.sel]);
$('m3').onclick=()=>abrirTroca([...S.sel],'alt');
$('gsug').onclick=()=>{
  const m=S.linhas.filter(l=>!l.alt&&altSug(l)).map(l=>({k:l.k,motorista:altSug(l),campo:'alt'}));if(!m.length)return;
  if(!confirm('Gravar na planilha o motorista alternativo sugerido pela região para '+plural(m.length,'seller','sellers')+'? Dá para desfazer logo depois.'))return;
  salvar(m,plural(m.length,'alternativo','alternativos')+' pela região');
};
$('m2').onclick=()=>abrirTroca(filtradas().map(l=>l.k));
// Exportar: CSV (ponto e vírgula, acentos corretos no Excel) com o que está filtrado
$('exportar').onclick=()=>{
  const cel=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const f=filtradas();
  const linhas=[['Seller','Clientes','Endereço','Bairro','Cidade','CEP','Média','Motorista','Motorista alternativo']].concat(f.map(l=>[l.seller,l.clientes.join(', '),l.endereco,l.bairro,l.cidade,l.cep,l.media||'',l.motorista||'',l.alt||'']));
  const blob=new Blob(['﻿'+linhas.map(r=>r.map(cel).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rotas-'+S.base+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('dq').oninput=desenharOps;
const fechaDlg=()=>$('dlg').close();
$('dx').onclick=fechaDlg;$('dxx').onclick=fechaDlg;
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))fechaDlg()}); // clique fora do quadro fecha
$('dl').addEventListener('click',e=>{
  const o=e.target.closest('.op');if(!o)return;
  const m=o.dataset.m,keys=S.alvo,alt=S.modo==='alt';
  if(keys.length>1&&!confirm((alt&&!m?'Remover o alternativo de ':'Trocar ')+keys.length+' sellers'+(m?' para '+m:'')+'?'))return;
  fechaDlg();
  S.sel.clear();
  salvar(keys.map(k=>alt?{k,motorista:m,campo:'alt'}:{k,motorista:m}),plural(keys.length,'seller','sellers')+(alt?' (alternativo)':'')+(m?' para '+curto(m):': alternativo removido'));
});
$('tu').onclick=()=>{if(S.desfazer){const d=S.desfazer;S.desfazer=null;$('toast').style.display='none';salvar(d,'desfeito')}};
document.querySelectorAll('.aba').forEach(a=>a.onclick=()=>{S.base=a.dataset.b;localStorage.setItem('rotas_base',S.base);limpaTudo();carregar()});
$('sinc').onclick=async()=>{
  const b=$('sinc'),aviso=(t,er)=>{$('tm').textContent=t;$('toast').className=er?'er':'';$('tu').hidden=true;$('toast').style.display='flex';clearTimeout(S.tt);S.tt=setTimeout(()=>$('toast').style.display='none',9000)};
  b.disabled=true;b.textContent='Sincronizando...';
  try{
    S.ocupado=true;
    const r=await chamar(CFG.api,{method:'POST',body:JSON.stringify({token:CFG.token,acao:'sincronizar',usuario})},0,330000);
    if(r.erro)throw new Error(r.erro);
    S.ocupado=false;
    await carregar();
    const f=(r.faltantes||[]).length,sm=r.semMotorista||0;
    aviso('Sincronizado: '+r.linhasNovas+(r.linhasNovas===1?' seller novo':' sellers novos')+', '+r.motoristasNovos+(r.motoristasNovos===1?' motorista novo':' motoristas novos')+(sm?' | '+sm+' sem motorista':'')+(f?' | ATENÇÃO: '+f+' seller(s) ficaram de fora':'')+(r.baseDesatualizada?' | base de coletados desatualizada':''),f>0||!!r.baseDesatualizada);
  }catch(e){aviso('Não foi possível sincronizar. Nada foi alterado.',true)}
  S.ocupado=false;
  b.disabled=false;b.textContent='Sincronizar com a planilha';
};
// Mantém a lista em dia para quem deixa a tela aberta: ao voltar para a aba e a cada 5 minutos
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(S.em||0)>120000&&!$('dlg').open)recarregar()});
setInterval(()=>{if(!document.hidden&&!S.sel.size&&!$('dlg').open)recarregar()},300000);
carregar();
</script>
